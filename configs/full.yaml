app:
  name: erp
  env: production
  version: 1.0.0
  timezone: UTC
  debug: false
audit:
  enabled: true
  retention_days: 365
feature_flags:
  inventory: true
  crm: true
  accounting: true
  manufacturing: false
  hr: true
backup:
  enabled: true
  database:
    cron: 0 2 * * *
    retention_days: 30
  storage:
    cron: 0 3 * * *
    retention_days: 30

session:
  provider: redis
  cookie_name: erp_session
  max_age: 24h
  secure: true
  http_only: true
  same_site: lax
auth:
  login_path: /auth/login
  logout_path: /auth/logout
  session_timeout: 8h
  password:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special_char: true
tenancy:
  enabled: false
  mode: single

database:
  driver: postgres
  host: postgres
  port: 5432
  database: erp
  username: postgres
  password: secret
  ssl_mode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1h

http:
  host: 0.0.0.0
  port: 8080
  domain: erp.example.com
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
openapi:
  endpoint: /docs
  path: /docs-json
  auth: false

integrations:
  payment:
    enabled: false
    stripe:
      secret_key: ""
  whatsapp:
    enabled: false
    token: ""
  webhook:
    enabled: true

jobs:
  enabled: true
  cleanup_logs:
    cron: 0 0 * * *
  recalculate_inventory:
    cron: "*/15 * * * *"
  generate_reports:
    cron: 0 1 * * *

logging:
  level: info
  format: json
  file:
    enabled: true
    path: ./storage/logs/app.log
  zap:
    stacktrace_level: error

messaging:
  email:
    enabled: true
    provider: smtp
    smtp:
      host: smtp.example.com
      port: 587
      username: noreply@example.com
      password: secret
      from_name: ERP
      from_email: noreply@example.com
  sms:
    enabled: false
    provider: twilio
    twilio:
      account_sid: ""
      auth_token: ""
      from_number: ""

modules:
  users:
    enabled: true
  roles:
    enabled: true
  permissions:
    enabled: true
  customers:
    enabled: true
  suppliers:
    enabled: true
  inventory:
    enabled: true
  products:
    enabled: true
  sales:
    enabled: true
  purchases:
    enabled: true
  accounting:
    enabled: true
  hr:
    enabled: true
  payroll:
    enabled: true
  crm:
    enabled: true
  reports:
    enabled: true

observability:
  metrics:
    enabled: true
    path: /metrics
  tracing:
    enabled: true
    exporter: otlp
    endpoint: tempo:4317
  profiling:
    enabled: false
queues:
  workers: 10
  retry_count: 3
  retry_delay: 30s
redis:
  enabled: true
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 20
security:
  cors:
    enabled: true
    allow_origins:
      - "*"
  rate_limit:
    enabled: true
    requests: 100
    duration: 1m

storage:
  default: local
  local:
    path: ./storage
  s3:
    enabled: false
    endpoint: ""
    bucket: ""
    region: ""
    access_key: ""
    secret_key: ""
watermill:
  transport: postgres
  command_bus:
    enabled: true
  event_bus:
    enabled: true
  router:
    close_timeout: 30s
  postgres:
    schema: watermill
