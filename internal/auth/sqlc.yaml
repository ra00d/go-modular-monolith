version: "2"
overrides:
  go:
    overrides:
      - db_type: "json"
        nullable: true
        engine: "postgresql"
        go_type:
          import: "modular-monolith/lib/db"
          package: "db"
          type: "NullRawMessage"
      - db_type: "jsonb"
        nullable: true
        engine: "postgresql"
        go_type:
          import: "modular-monolith/lib/db"
          package: "db"
          type: "NullRawMessage"

sql:
  - engine: "postgresql"
    queries: "sql"
    schema: "migrations"
    gen:
      go:
        out: "infrastructure/users"
        omit_unused_structs: true
        emit_prepared_queries: true
        output_models_file_name: "types.go"
        output_copyfrom_file_name: "copyfrom.go"
        # output_models_emit: false
        output_files_suffix: "_gen"
